# Build RiskLab as a fully static site and deploy it to GitHub Pages.
# Static mode: content is exported from the Python API into a JSON snapshot, calculations run in a
# TypeScript port of the engine that is parity-tested against Python on every build.
name: Deploy RiskLab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable / configure GitHub Pages (source = Actions)
        uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }

      - name: Install backend
        run: pip install -r backend/requirements.txt
      - name: Backend tests (engine + API + content lint)
        run: python -m pytest backend/tests -q
      - name: Export static snapshot + parity fixtures
        run: python backend/scripts/export_static.py

      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: TypeScript engine parity vs Python
        working-directory: frontend
        run: npm run parity
      - name: Build static site
        working-directory: frontend
        env:
          NEXT_PUBLIC_STATIC: "1"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build
      - run: touch frontend/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend/out }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
