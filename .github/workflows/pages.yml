# Build RiskLab as a fully static site and deploy it to GitHub Pages.
# Static mode: content is exported from the Python API into a JSON snapshot, calculations run in a
# TypeScript port of the engine that is parity-tested against Python on every build.
name: Deploy RiskLab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable / configure GitHub Pages (source = Actions)
        uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }

      - name: Install backend
        run: pip install -r backend/requirements.txt
      - name: Backend tests (engine + API + content lint)
        run: python -m pytest backend/tests -q
      - name: Export static snapshot + parity fixtures
        run: python backend/scripts/export_static.py

      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: TypeScript engine parity vs Python
        working-directory: frontend
        run: npm run parity
      - name: Build static site
        working-directory: frontend
        env:
          NEXT_PUBLIC_STATIC: "1"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build
      - run: touch frontend/out/.nojekyll

      # Black-Scholes Laboratory (black_scholes_lab/) is published as a MkDocs sub-site
      # of the same Pages deployment, at /<repo>/black-scholes-lab/.
      - name: Install Black-Scholes Lab, XVA Lab, Volatility & Correlation Lab + MkDocs
        run: pip install -r black_scholes_lab/requirements.txt -r xva_lab/requirements.txt -r vol_corr_lab/requirements.txt mkdocs-material "mkdocstrings[python]"
      - name: Black-Scholes Lab tests
        working-directory: black_scholes_lab
        run: python -m pytest -q
      - name: Build Black-Scholes Lab site
        working-directory: black_scholes_lab
        run: mkdocs build --strict --site-dir ../frontend/out/black-scholes-lab

      # Counterparty Exposure & XVA Laboratory (xva_lab/) is published the same way, at /<repo>/xva-lab/.
      - name: XVA Lab tests
        working-directory: xva_lab
        run: python -m pytest -q
      - name: Build XVA Lab site
        working-directory: xva_lab
        run: mkdocs build --strict --site-dir ../frontend/out/xva-lab

      # Volatility & Correlation Risk Laboratory (vol_corr_lab/) is published the same way, at /<repo>/vol-corr-lab/.
      - name: Volatility & Correlation Lab tests
        working-directory: vol_corr_lab
        run: python -m pytest -q
      - name: Build Volatility & Correlation Lab site
        working-directory: vol_corr_lab
        run: mkdocs build --strict --site-dir ../frontend/out/vol-corr-lab

      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend/out }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
