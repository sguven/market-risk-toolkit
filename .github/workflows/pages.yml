# Build the three educational laboratories (MkDocs) and deploy them to GitHub Pages:
#   /<repo>/                 landing page (site/index.html)
#   /<repo>/black-scholes-lab/
#   /<repo>/xva-lab/
#   /<repo>/vol-corr-lab/
name: Deploy laboratories to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable / configure GitHub Pages (source = Actions)
        uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install laboratories + MkDocs
        run: pip install -r black_scholes_lab/requirements.txt -r xva_lab/requirements.txt -r vol_corr_lab/requirements.txt mkdocs-material "mkdocstrings[python]"

      - name: Landing page
        run: mkdir -p _site && cp site/index.html _site/ && touch _site/.nojekyll

      - name: Black-Scholes Lab tests
        working-directory: black_scholes_lab
        run: python -m pytest -q
      - name: Build Black-Scholes Lab site
        working-directory: black_scholes_lab
        run: mkdocs build --strict --site-dir ../_site/black-scholes-lab

      - name: XVA Lab tests
        working-directory: xva_lab
        run: python -m pytest -q
      - name: Build XVA Lab site
        working-directory: xva_lab
        run: mkdocs build --strict --site-dir ../_site/xva-lab

      - name: Volatility & Correlation Lab tests
        working-directory: vol_corr_lab
        run: python -m pytest -q
      - name: Build Volatility & Correlation Lab site
        working-directory: vol_corr_lab
        run: mkdocs build --strict --site-dir ../_site/vol-corr-lab

      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
