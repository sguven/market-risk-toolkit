[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vclab"
version = "1.0.0"
description = "Volatility and Correlation Risk Laboratory: volatility estimation, implied volatility surfaces, vega risk, variance swaps, correlation estimation, stress and products, FRTB treatment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["vclab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
