[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bslab"
version = "1.0.0"
description = "Black-Scholes Laboratory: educational option pricing, exotic simulation and market-risk framework applications (FRTB-SA, VaR/ES, stress, SR 11-7)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["bslab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
