# Phase 1: api + web. PostgreSQL is declared for Phase 2 (content/progress persistence) and is
# not yet used by the application.
services:
  api:
    build: ./backend
    command: uvicorn risklab_api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      RISKLAB_CORS_ORIGINS: http://localhost:3000
  web:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]
  db:
    image: postgres:16
    environment: { POSTGRES_DB: risklab, POSTGRES_USER: risklab, POSTGRES_PASSWORD: risklab }
    ports: ["5432:5432"]
    profiles: ["phase2"]
