[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xvalab"
version = "1.0.0"
description = "Counterparty Exposure and XVA Laboratory: exposure simulation, netting and collateral, CVA/DVA/FVA/MVA, wrong-way risk, SA-CCR / IMM / BA-CVA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["xvalab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
