site_name: XVA Laboratory
site_description: Educational module on counterparty credit exposure simulation, netting and collateral, CVA / DVA / FVA / MVA, wrong-way risk and the Basel / U.S. counterparty credit risk rules (SA-CCR, IMM, BA-CVA).
site_url: https://sguven.github.io/market-risk-toolkit/xva-lab/
repo_url: https://github.com/sguven/market-risk-toolkit
repo_name: sguven/market-risk-toolkit
edit_uri: edit/main/xva_lab/docs/
docs_dir: docs
site_dir: site
copyright: Educational material. Illustrative data. Not investment, legal or regulatory advice.

theme:
  name: material
  language: en
  icon:
    logo: material/handshake-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

nav:
  - Home: index.md
  - Course:
      - 1. Counterparty credit risk: 01_counterparty_credit_risk.md
      - 2. Simulating future exposure: 02_exposure_simulation.md
      - 3. Netting, collateral and margin: 03_netting_and_collateral.md
      - 4. CVA and DVA: 04_cva_and_dva.md
      - 5. FVA, MVA and the others: 05_fva_and_mva.md
      - 6. Wrong-way risk: 06_wrong_way_risk.md
  - Regulation:
      - 7. The regulatory framework: 07_regulation.md
      - References: references.md
  - Examples: 08_example_outputs.md
  - API reference: 09_api_reference.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: false
            show_root_toc_entry: false
            members_order: source
            heading_level: 3
            show_signature_annotations: true
            separate_signature: true
            filters: ["!^_"]

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sguven/market-risk-toolkit
