questions:
  - id: q1
    stem: A position is in the trading book if it is…
    choices: [Any derivative, Held with trading intent or to hedge trading-book positions and fair-valued daily, Any bond rated below investment grade, Held for more than one year]
    answer_index: 1
    rationale: Trading intent and daily fair valuation are the core criteria in RBC25.
  - id: q2
    stem: Under FRTB, moving an instrument from the trading book to the banking book…
    choices: [Is at the bank's discretion, Requires supervisory approval and any capital benefit is neutralised by a surcharge, Is prohibited in all cases, Is automatic after 90 days]
    answer_index: 1
    rationale: RBC25 restricts switching and removes the capital incentive.
  - id: q3
    stem: Why did the Basel Committee tighten the boundary?
    choices: [To simplify reporting, Because intent-based classification enabled regulatory arbitrage during the crisis, To eliminate the banking book, To reduce capital for trading desks]
    answer_index: 1
    rationale: Banks had moved positions between books to lower capital.
