[project]
name = "risklab-backend"
version = "0.1.0"
description = "RiskLab — quantitative engine and FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27,<1", "hypothesis>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["risklab_engine*", "risklab_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
